name: OpenL Tests
run-name: "OpenL Tests [${{ inputs.application_version }}]"

on:
  workflow_dispatch:
    inputs:
      application_version:
        description: "OpenL Docker image tag"
        required: true
        default: "x"
      tests_branch:
        description: "Autotests branch label for reporting"
        required: true
        default: "main"
      rp_launch_name:
        description: "ReportPortal launch name"
        required: true
        default: "webstudio_tests"
      tests:
        description: >-
          Selective run. Leave EMPTY to run every test class of the 8 regression suites. To run only some tests,
          list their test CLASS names separated by commas or spaces: simple names (TestMethodTable) or fully
          qualified ones (tests.ui.webstudio.git.TestGitBranchSwitching). Individual @Test methods cannot be
          selected, the whole class runs. The listed classes are pooled and balanced over min(shards, classes)
          jobs; every job has both the Studio and the Rule Services image, a class picks the one it declares.
          The rp-export and the merged report label every test with the suite its class is declared in and
          carry the attribute run:selective. The "Discover test shards" job fails immediately when a name
          contains characters other than letters, digits, dots and underscores, or when a name is not found in
          any suite (check the spelling).
        required: false
        default: ""
      shards:
        description: >-
          Number of parallel shards for a full run. All test classes of the 8 regression suites are pooled and
          spread over this many GitHub jobs by their measured duration (scripts/github-actions/test-weights.json),
          so every job finishes at about the same time. The default matches max-parallel of the workflow; a
          selective run never uses more shards than it has classes.
        required: false
        default: "20"

env:
  RP_LAUNCH_NAME: ${{ inputs.rp_launch_name }}
  SELECTED_TESTS: ${{ inputs.tests }}
  SHARDS: ${{ inputs.shards }}
  # Keep the image tag and the npm package in step with PLAYWRIGHT_VERSION / PLAYWRIGHT_NPM_PACKAGE in DockerDriverPool.java
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.52.0-noble
  PLAYWRIGHT_NPM_PACKAGE: playwright@1.52.0

jobs:
  discover-tests:
    name: Discover test shards
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Checkout tests
        uses: actions/checkout@v4

      - name: Generate test matrix
        id: matrix
        run: |
          if [ -n "${SELECTED_TESTS}" ]; then
            echo "Selective run requested for: ${SELECTED_TESTS}"
          fi
          MATRIX="$(python3 scripts/github-actions/generate-test-matrix.py --shards "${SHARDS:-20}" --classes="${SELECTED_TESTS}")"
          echo "matrix=${MATRIX}" >> "${GITHUB_OUTPUT}"
          echo "${MATRIX}"

  test-shard:
    name: ${{ matrix.display }}
    needs: discover-tests
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.discover-tests.outputs.matrix) }}

    steps:
      - name: Checkout tests
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Generate TestNG shard suite
        run: |
          python3 scripts/github-actions/generate-testng-suite.py \
            --classes "${{ matrix.classes }}" \
            --output "generated-testng/${{ matrix.display }}.xml" \
            --suite-name "OpenL GHA ${{ matrix.display }}"

      - name: Warm up the Playwright Server image and its npm cache
        continue-on-error: true
        run: |
          PLAYWRIGHT_NPM_CACHE_DIR="${RUNNER_TEMP}/playwright-npm-cache"
          mkdir -p "${PLAYWRIGHT_NPM_CACHE_DIR}"
          docker pull -q "${PLAYWRIGHT_IMAGE}"
          time docker run --rm -v "${PLAYWRIGHT_NPM_CACHE_DIR}:/root/.npm" "${PLAYWRIGHT_IMAGE}" \
            sh -c "npx -y ${PLAYWRIGHT_NPM_PACKAGE} --version"

      - name: Run shard
        env:
          BUILD_LABEL: ${{ inputs.application_version }}
          TESTS_BRANCH: ${{ inputs.tests_branch }}
          STUDIO_IMAGE_KIND: ${{ matrix.studio_image_kind }}
          WS_IMAGE_KIND: ${{ matrix.ws_image_kind }}
          APPLICATION_VERSION: ${{ inputs.application_version }}
        run: |
          resolve_image() {
            case "$1" in
              webstudio) echo "ghcr.io/openl-tablets/webstudio:${APPLICATION_VERSION}" ;;
              ws)        echo "ghcr.io/openl-tablets/ws:${APPLICATION_VERSION}-all" ;;
              *) echo "Unknown image kind: $1" >&2; exit 1 ;;
            esac
          }
          STUDIO_IMAGE="$(resolve_image "${STUDIO_IMAGE_KIND}")"
          WS_IMAGE="$(resolve_image "${WS_IMAGE_KIND}")"
          PLAYWRIGHT_NPM_CACHE_DIR="${RUNNER_TEMP}/playwright-npm-cache"
          RP_ATTRIBUTES="build:${BUILD_LABEL};tests_branch:${TESTS_BRANCH};github_run_id:${GITHUB_RUN_ID}"
          if [ -n "${SELECTED_TESTS}" ]; then
            RP_ATTRIBUTES="${RP_ATTRIBUTES};run:selective"
          fi
          echo "Using docker_image_name=${STUDIO_IMAGE}"
          echo "Using ws_docker_image_name=${WS_IMAGE}"
          echo "Using rp.attributes=${RP_ATTRIBUTES}"

          mvn clean test \
            -Drp.enable=false \
            -Dlog4j.configurationFile=src/test/resources/log4j2-gha.xml \
            -Dexecution.mode=PLAYWRIGHT_DOCKER \
            -Djava.net.preferIPv4Stack=true \
            -DsuiteXmlFile=generated-testng/${{ matrix.display }}.xml \
            -Ddocker_image_name="${STUDIO_IMAGE}" \
            -Dws_docker_image_name="${WS_IMAGE}" \
            -Dplaywright_default_timeout=20000 \
            -Dapp_container_startup_timeout_minutes=10 \
            -Dplaywright_server_startup_timeout_seconds=300 \
            -Dplaywright_npm_cache_dir="${PLAYWRIGHT_NPM_CACHE_DIR}" \
            -Drp.project=OpenL_Tests \
            -Drp.launch="${RP_LAUNCH_NAME}" \
            -Drp.attributes="${RP_ATTRIBUTES}" \
            -Drp.export.dir=target/rp-export

      - name: Fail on failed TestNG results
        if: always()
        run: |
          if [ -f target/surefire-reports/testng-results.xml ] && grep -Eq 'failed="[1-9]|skipped="[1-9]' target/surefire-reports/testng-results.xml; then
            echo "TestNG reported failed or skipped tests"
            exit 1
          fi

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openl-tests-${{ matrix.display }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            target/rp-export/**
            target/surefire-reports/**
            target/screenshots/**
            target/videos/**
            target/logs/**
            target/downloads/**
            generated-testng/**

  merge-reportportal-export:
    name: Merge ReportPortal export and test report
    needs:
      - test-shard
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tests
        uses: actions/checkout@v4

      - name: Download shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: openl-tests-*
          path: downloaded-artifacts
          merge-multiple: false

      - name: Merge ReportPortal exports
        run: |
          python3 scripts/github-actions/merge-rp-exports.py \
            --input-root downloaded-artifacts \
            --output-dir merged-rp-export \
            --suite-dir src/test/resources/testng_suites \
            --launch-name "${RP_LAUNCH_NAME}"

      - name: Upload merged ReportPortal export
        uses: actions/upload-artifact@v4
        with:
          name: rp-export-merged
          if-no-files-found: error
          retention-days: 14
          path: merged-rp-export/**

      - name: Build merged test report
        if: always()
        env:
          BUILD_LABEL: ${{ inputs.application_version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 scripts/github-actions/generate-merged-report.py \
            --input-root downloaded-artifacts \
            --output-dir merged-report \
            --title "OpenL Tests [${BUILD_LABEL}]" \
            --build "${BUILD_LABEL}" \
            --run-url "${RUN_URL}"

      - name: Upload merged test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-merged
          if-no-files-found: error
          retention-days: 14
          path: merged-report/**
