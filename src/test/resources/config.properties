#======================= Database Containers =========================#

# Hostname used by app container to reach host-mapped Testcontainers ports
# On Mac/Windows Docker Desktop this is automatic; on Linux may need --add-host flag
db.container.host=host.docker.internal

# PostgreSQL Testcontainers integration
db.postgres.container.image=postgres:alpine
db.postgres.jar.maven.path=.m2/repository/org/postgresql/postgresql/42.7.11/postgresql-42.7.11.jar

# Oracle Testcontainers integration
db.oracle.container.image=gvenzl/oracle-free:slim-faststart
db.oracle.jar.maven.path=.m2/repository/com/oracle/database/jdbc/ojdbc11/23.7.0.25.01/ojdbc11-23.7.0.25.01.jar

# MS SQL Server Testcontainers integration
db.mssql.container.image=mcr.microsoft.com/mssql/server:2022-latest
db.mssql.jar.maven.path=.m2/repository/com/microsoft/sqlserver/mssql-jdbc/13.2.1.jre11/mssql-jdbc-13.2.1.jre11.jar

# S3Mock Testcontainers integration
s3mock.docker.image=adobe/s3mock:4.11.0

