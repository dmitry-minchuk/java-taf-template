#===========================================================#
#=================== Core Configuration ====================#
#===========================================================#

test_retry_count=1
playwright_default_timeout=10000
overlay_idle_timeout=60000
app_container_startup_timeout_minutes=5

#================ Container Configuration ==================#

browser=chrome
browser_version=latest
default_app_port=8080
docker_image_name=ghcr.io/openl-tablets/webstudio:6.5.0-b139ce218c1f
ws_docker_image_name=ghcr.io/openl-tablets/ws:6.5.0-b139ce218c1f-all
deployed_app_path=
#test data folders mapped
host_resource_path=src/test/resources
container_resource_path=/test_resources
#test artefacts folders
host_screenshot_path=target/screenshots
host_app_logs_path=target/logs

#==================== Playwright Configuration ===================#

# Media capture settings
enable_video_recording=true
enable_screenshot_on_failure=true
playwright_downloads_path=target/downloads
playwright_videos_path=target/videos

#==================== User Test Data =======================#

user_pool=admin_user::openl_1_user::openl_2_user::openl_ac_user

admin_user.login=admin
admin_user.password=admin

